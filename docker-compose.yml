version: "3.9"
services:
    VulnerableApp-base:
      image: sasanlabs/owasp-vulnerableapp:latest
      # The container filesystem is read-only, so a payload cannot be dropped into the image.
      # Only the paths the application writes to at runtime are writable, as tmpfs: /tmp
      # (embedded Tomcat work directory and multipart temp files), /logs (log4j2 rolling file),
      # /benchmarks (benchmark.output.dir) and the two UnrestrictedFileUpload directories.
      read_only: true
      tmpfs:
        - /tmp
        - /logs
        - /benchmarks
        - /contentDispositionUpload
        - /app/resources/static/upload
      networks:
        - app_net
      
    VulnerableApp-jsp:
      image: sasanlabs/owasp-vulnerableapp-jsp:latest
      networks:
        - app_net
 
    VulnerableApp-php:
      image: sasanlabs/owasp-vulnerableapp-php:latest
      networks:
        - app_net

    ollama:
      image: ollama/ollama:latest
      ports:
       - "11434:11434"
      volumes:
       - ollama_data:/root/.ollama
      # Models, keys and history live on the ollama_data volume, so the image itself can stay
      # read-only; /tmp is a tmpfs for scratch files.
      read_only: true
      tmpfs:
       - /tmp
      healthcheck:
        test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 20s
      networks:
        app_net:
          aliases:
            - ollama

    ollama-model-init:
      image: ollama/ollama:latest
      depends_on:
        ollama:
          condition: service_healthy
      environment:
       - OLLAMA_HOST=http://ollama:11434
       - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:mini}
       - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      entrypoint: /bin/sh
      command:
       - "-c"
       - |
          set -eu
          ollama pull "${OLLAMA_MODEL:-phi3:mini}"
          ollama pull "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      volumes:
       - ollama_data:/root/.ollama
      # The pulled models are written to the ollama_data volume, nothing else needs to be
      # writable, so the image stays read-only with a tmpfs for scratch files.
      read_only: true
      tmpfs:
       - /tmp
      restart: "no"
      networks:
        - app_net

    llmforge:
      image: sasanlabs/llmforge:latest
      depends_on:
        ollama:
          condition: service_healthy
        ollama-model-init:
          condition: service_completed_successfully
      ports:
       - "8000:8000"
      environment:
       - OLLAMA_URL=http://ollama:11434
       - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3:mini}
       - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
       - FACADE_ROUTE_PREFIX=/llmforge
      networks:
        app_net:
          aliases:
            - llmforge

    mailpit:
      image: axllent/mailpit:v1.30.1
      restart: unless-stopped
      expose:
        - "1025"
      ports:
        - "8025:8025"
      environment:
        - MP_MAX_MESSAGES=5000
        - MP_DATABASE=/data/mailpit.db
        - MP_SMTP_AUTH_ACCEPT_ANY=1
        - MP_SMTP_AUTH_ALLOW_INSECURE=1
        - MP_WEBROOT=/mailpit
      volumes:
        - mailpit_data:/data
      # The message store (MP_DATABASE) is on the mailpit_data volume, so the image can stay
      # read-only; /tmp is a tmpfs for the database scratch files.
      read_only: true
      tmpfs:
        - /tmp
      networks:
        app_net:
          aliases:
            - mailpit
    
    VulnerableApp-facade:
      depends_on:
        - VulnerableApp-base
        - VulnerableApp-jsp
        - VulnerableApp-php
        - llmforge
        - mailpit
      image: sasanlabs/owasp-vulnerableapp-facade:latest
      volumes:
       - ./templates:/etc/nginx/templates
      ports:
       - "80:80"
      environment:
       - NGINX_HOST=foobar.com
       - NGINX_PORT=80
       - ENABLE_VULNERABLEAPP_JSP=true
       - ENABLE_VULNERABLEAPP_PHP=true
       - ENABLE_LLMFORGE=true
      networks:
        - app_net

networks:
  app_net:
    name: vulnerableapp-facade_net
    driver: bridge

volumes:
  ollama_data:
  mailpit_data:
