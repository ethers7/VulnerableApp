server.port=9090
server.servlet.context-path=/VulnerableApp
# H2 Database inmem configuration Admin user configurations
spring.datasource.admin.url=jdbc:h2:mem:testdb
spring.datasource.admin.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Database Application user configurations
spring.datasource.application.url=jdbc:h2:mem:testdb
spring.datasource.application.driverClassName=org.h2.Driver

# Custom H2 Console URL
spring.h2.console.path=/h2

spring.profiles.active=public,unsafe

# Pre-Populating data and schema is handled by DataSourceInitializer bean in VulnerableAppConfiguration.java
spring.jpa.hibernate.ddl-auto=none

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG

gistId.sasanlabs.projects=bbf2e2183b8f6252061663ce0ddee79b

# SMTP / Email Configuration
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=smtp_hacker
spring.mail.password=smtp_password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

vulnerableapp.email.from=no-reply@vulnerableapp.local

# Directory where scanner benchmark result files are written by /scanner/benchmark
benchmark.output.dir=benchmarks

# SAST ground-truth CSV consumed by /scanner/benchmark when scanType=SAST and served
# by /scanner/sast. Defaults to a classpath resource so it always ships with the jar;
# a filesystem path (relative to the working directory or absolute) is also accepted.
benchmark.sast.ground-truth.path=classpath:scanner/sast/expectedIssues.csv

# URL of the DAST ground-truth endpoint that /scanner/benchmark grades against.
# Defaults to a self-call against the running app's /scanner/dast; override
# (e.g., to the VulnerableApp-facade aggregated /scanner/dast endpoint) when
# running in a multi-app deployment so coverage reflects the full attack surface.
benchmark.dast.ground-truth.url=http://localhost:${server.port:9090}${server.servlet.context-path:/VulnerableApp}/scanner/dast

# Connect / read timeouts (ms) for the DAST ground-truth fetch. Tight defaults
# so a slow or unreachable endpoint fails fast instead of hanging Tomcat
# request threads. Bump these if your facade or network is genuinely slower.
benchmark.dast.ground-truth.connect-timeout-ms=5000
benchmark.dast.ground-truth.read-timeout-ms=10000

# RSA key pair used by the asymmetric (RS256) JWT levels. No key material is committed with the
# application: point these at PKCS#8 PEM files that the deployment provides (mounted secret, file
# materialised by a secrets manager, ...), e.g.
#   JWT_RSA_PRIVATE_KEY_LOCATION=/run/secrets/jwt_private_key.pem
#   JWT_RSA_PUBLIC_KEY_LOCATION=/run/secrets/jwt_public_key.pem
# A "classpath:" prefix is also accepted. When both are left empty a throw-away RSA key pair is
# generated in memory during startup, so the levels work without any key on disk.
# The RSA private key that used to be committed under
# src/main/resources/static/templates/JWTVulnerability/keys has been removed. It is still present in
# the git history (and was publicly readable, both from the repository and as a served static
# resource), so it must be treated as compromised: revoke/reissue that key pair and never reuse it
# for anything beyond a throw-away lab token.
vulnerableapp.jwt.rsa.private-key-location=${JWT_RSA_PRIVATE_KEY_LOCATION:}
vulnerableapp.jwt.rsa.public-key-location=${JWT_RSA_PUBLIC_KEY_LOCATION:}

##Details for KeyPair generation in application
#keytool -genkeypair -alias SasanLabs -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore sasanlabs.p12 -validity 3650

# Password of the PKCS#12 keystore (sasanlabs.p12) that holds the RS256 key pair used by the
# asymmetric JWT levels. No keystore password is committed with the application: supply it from the
# deployment (environment variable, mounted secret, secrets manager, ...), e.g.
#   JWT_KEYSTORE_PASSWORD=<password of the keystore you provide>
# When left empty the keystore is not opened and a throw-away RSA key pair is generated in memory
# during startup, so the levels work without any keystore credential on disk.
vulnerableapp.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD:}

# Passwords of the BCrypt backed users of the Authentication module (levels 8, 9 and 10). No
# password hash is committed with the application any more: AuthenticationSeeder hashes these
# values during startup, so supply them from the deployment (environment variable, mounted secret,
# secrets manager, ...), e.g.
#   AUTH_WEAK_PASSWORD=<weak, guessable password for the level 8 dictionary-attack lesson>
#   AUTH_SECURE_PASSWORD=<strong password for the secure level 9 baseline>
#   AUTH_LOW_ITERATION_PASSWORD=<password for the level 10 low-cost-factor lesson>
# When one is left empty a random password is generated for that startup, so the levels keep
# working out of the box; set the property when the level has to be solvable by cracking the
# stored hash offline. The BCrypt hashes previously seeded from
# src/main/resources/scripts/Authentication/db/data.sql have been removed, but they remain in the
# git history: treat the passwords they were derived from as compromised and never reuse them.
vulnerableapp.authentication.weak-password=${AUTH_WEAK_PASSWORD:}
vulnerableapp.authentication.secure-password=${AUTH_SECURE_PASSWORD:}
vulnerableapp.authentication.low-iteration-password=${AUTH_LOW_ITERATION_PASSWORD:}
