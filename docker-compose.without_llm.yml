version: "3.9"
services:
    VulnerableApp-base:
      image: sasanlabs/owasp-vulnerableapp:latest
      # The container filesystem is read-only, so a payload cannot be dropped into the image.
      # Only the paths the application writes to at runtime are writable, as tmpfs: /tmp
      # (embedded Tomcat work directory and multipart temp files), /logs (log4j2 rolling file),
      # /benchmarks (benchmark.output.dir) and the two UnrestrictedFileUpload directories.
      read_only: true
      tmpfs:
        - /tmp
        - /logs
        - /benchmarks
        - /contentDispositionUpload
        - /app/resources/static/upload
      security_opt:
        - no-new-privileges:true

    VulnerableApp-jsp:
      image: sasanlabs/owasp-vulnerableapp-jsp:latest
      security_opt:
        - no-new-privileges:true

    VulnerableApp-php:
      image: sasanlabs/owasp-vulnerableapp-php:latest
      security_opt:
        - no-new-privileges:true

    mailpit:
      image: axllent/mailpit:v1.30.1
      restart: unless-stopped
      expose:
        - "1025"
      ports:
        - "8025:8025"
      environment:
        - MP_MAX_MESSAGES=5000
        - MP_DATABASE=/data/mailpit.db
        - MP_SMTP_AUTH_ACCEPT_ANY=1
        - MP_SMTP_AUTH_ALLOW_INSECURE=1
        - MP_WEBROOT=/mailpit
      volumes:
        - mailpit_data:/data
      # The message store (MP_DATABASE) is on the mailpit_data volume, so the image can stay
      # read-only; /tmp is a tmpfs for the database scratch files.
      read_only: true
      tmpfs:
        - /tmp
      security_opt:
        - no-new-privileges:true

    VulnerableApp-facade:
      depends_on:
        - VulnerableApp-base
        - VulnerableApp-jsp
        - VulnerableApp-php
        - mailpit
      image: sasanlabs/owasp-vulnerableapp-facade:latest
      security_opt:
        - no-new-privileges:true
      volumes:
       - ./templates:/etc/nginx/templates
      ports:
       - "80:80"
      environment:
       - NGINX_HOST=foobar.com
       - NGINX_PORT=80
       - ENABLE_VULNERABLEAPP_JSP=true
       - ENABLE_VULNERABLEAPP_PHP=true
       - ENABLE_LLMFORGE=false

volumes:
  mailpit_data: