version: "3.9"
services:
    VulnerableApp-base:
      image: sasanlabs/owasp-vulnerableapp:latest
      read_only: true
      security_opt:
        - no-new-privileges:true
      tmpfs:
        - /tmp

    VulnerableApp-jsp:
      image: sasanlabs/owasp-vulnerableapp-jsp:latest
      read_only: true
      security_opt:
        - no-new-privileges:true
      tmpfs:
        - /tmp

    VulnerableApp-php:
      image: sasanlabs/owasp-vulnerableapp-php:latest
      read_only: true
      security_opt:
        - no-new-privileges:true
      tmpfs:
        - /tmp
        - /var/run

    mailpit:
      image: axllent/mailpit:v1.30.1
      read_only: true
      security_opt:
        - no-new-privileges:true
      tmpfs:
        - /tmp
      restart: unless-stopped
      expose:
        - "1025"
      ports:
        - "8025:8025"
      environment:
        - MP_MAX_MESSAGES=5000
        - MP_DATABASE=/data/mailpit.db
        - MP_SMTP_AUTH_ACCEPT_ANY=1
        - MP_SMTP_AUTH_ALLOW_INSECURE=1
        - MP_WEBROOT=/mailpit
      volumes:
        - mailpit_data:/data

    VulnerableApp-facade:
      depends_on:
        - VulnerableApp-base
        - VulnerableApp-jsp
        - VulnerableApp-php
        - mailpit
      image: sasanlabs/owasp-vulnerableapp-facade:latest
      read_only: true
      security_opt:
        - no-new-privileges:true
      tmpfs:
        - /tmp
        - /var/run
        - /var/cache/nginx
      volumes:
       - ./templates:/etc/nginx/templates
      ports:
       - "80:80"
      environment:
       - NGINX_HOST=foobar.com
       - NGINX_PORT=80
       - ENABLE_VULNERABLEAPP_JSP=true
       - ENABLE_VULNERABLEAPP_PHP=true
       - ENABLE_LLMFORGE=false

volumes:
  mailpit_data:
